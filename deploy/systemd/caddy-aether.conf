aether.example.com {
    encode zstd gzip
    @senses path /senses /senses/* /api/browser-senses /api/browser-senses/*
    handle @senses { reverse_proxy 127.0.0.1:8000 }
    handle_path /aether/* { reverse_proxy 127.0.0.1:8000 }
    handle /health {
        rewrite * /api/status
        reverse_proxy 127.0.0.1:8000
    }
    handle { reverse_proxy 127.0.0.1:25808 }
}
