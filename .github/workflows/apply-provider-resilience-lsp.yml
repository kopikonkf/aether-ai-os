name: Apply provider resilience handoff patch

on:
  push:
    branches:
      - agent/provider-resilience-contracts
    paths:
      - project-docs/testing/provider-resilience-lsp.patch
      - .github/workflows/apply-provider-resilience-lsp.yml
  pull_request:
    branches:
      - main
    paths:
      - project-docs/testing/provider-resilience-lsp.patch
      - .github/workflows/apply-provider-resilience-lsp.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/provider-resilience-contracts
          fetch-depth: 0
      - name: Apply canonical handoff patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check project-docs/testing/provider-resilience-lsp.patch
          git apply project-docs/testing/provider-resilience-lsp.patch
          rm project-docs/testing/provider-resilience-lsp.patch
          rm .github/workflows/apply-provider-resilience-lsp.yml
          git config user.name "Aether CI"
          git config user.email "actions@users.noreply.github.com"
          git add LASTSTANDINGPOINT.md project-docs/testing/provider-resilience-lsp.patch .github/workflows/apply-provider-resilience-lsp.yml
          git commit -m "Update provider resilience canonical handoff"
          git push origin HEAD:agent/provider-resilience-contracts
