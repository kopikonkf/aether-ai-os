name: Aether CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aether-gateway/browser/package-lock.json
      - name: Install locked Senses browser dependencies
        working-directory: aether-gateway/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild and verify the committed Senses browser bundle
        working-directory: aether-gateway/browser
        run: |
          npm run bundle:senses
          git diff --exit-code -- ../src/aether_gateway/aionui_senses_console/vendor/livekit-client-2.17.2.esm.js
      - name: Install source packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./aether-core -e ./aether-tools -e "./aether-gateway[dev,livekit]"
      - name: Compile source
        run: python -m compileall -q aether-core/src aether-tools/src aether-gateway/src scripts deploy/windows
      - name: Senses client reducer tests
        run: node --test aether-gateway/tests/client_state_reducer.test.mjs aether-gateway/tests/capability_actions.test.mjs aether-gateway/tests/turn_generation.test.mjs aether-gateway/tests/vision_capture.test.mjs aether-gateway/tests/pwa_cache_policy.test.mjs aether-gateway/tests/pwa_runtime.test.mjs
      - name: Core tests
        run: python -m pytest -q aether-core/tests
      - name: Tools tests
        run: python -m pytest -q aether-tools/tests
      - name: Root deployment tests
        run: python -m pytest -q tests
      - name: Gateway tests in isolated processes
        run: python scripts/run_gateway_tests_isolated.py --output gateway-test-receipt.json
      - name: Parse JSON and YAML assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import yaml

          tracked_assets = subprocess.check_output(
              [
                  'git',
                  'ls-files',
                  '-z',
                  '--',
                  '*.json',
                  '*.webmanifest',
                  '*.yaml',
                  '*.yml',
              ]
          ).decode('utf-8').split('\0')

          for raw_path in filter(None, tracked_assets):
              path = Path(raw_path)
              content = path.read_text('utf-8')
              if path.suffix in {'.json', '.webmanifest'}:
                  json.loads(content)
              else:
                  yaml.safe_load(content)
          PY
      - name: Validate Cloudflare ingress assets
        run: |
          python -m pytest -q tests/test_cloudflare_ingress_assets.py tests/test_cloudflare_probe_modes.py tests/test_cloudflare_ingress_integration.py -p no:cacheprovider
      - name: Real ingress boundary proof + PowerShell asset execution (not skipped)
        run: |
          # Install PowerShell (pwsh) from the official release so the probe
          # script and the production tunnel/promotion .ps1 can execute for real.
          sudo mkdir -p /opt/microsoft/powershell/7
          curl -fsSL -o /tmp/pwsh.tar.gz "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-x64.tar.gz"
          sudo tar zxf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7
          sudo chmod +x /opt/microsoft/powershell/7/pwsh
          sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          # Install Caddy so the boundary proof uses the real router, not a mirror.
          cd /tmp
          curl -fsSL -o caddy.tar.gz "https://github.com/caddyserver/caddy/releases/download/v2.11.3/caddy_2.11.3_linux_amd64.tar.gz"
          tar -xzf caddy.tar.gz caddy
          sudo mv caddy /usr/local/bin/caddy
          caddy version
          cd "${{ github.workspace }}"
          # Ingress Caddy boundary proof (real Caddy + echo + real probe).
          AETHER_INGRESS_INTEGRATION=1 python -m pytest -q tests/test_cloudflare_ingress_integration.py -p no:cacheprovider
          # Executes the production deploy/cloudflare/update-shared-tunnel.ps1 for
          # real against temp YAML (apply path, stub cloudflared): emitted-YAML,
          # validate-before-replace, atomic backup, and failure-rollback.
          python -m pytest -q tests/test_powershell_ingress_execution.py -p no:cacheprovider
        env:
          AETHER_INGRESS_INTEGRATION: "1"
      - name: Validate Caddyfile with Caddy
        run: |
          mkdir -p caddy-validate
          cp "${{ github.workspace }}/deploy/windows/Caddyfile" caddy-validate/Caddyfile
          # Point the import at a committed stub fragment so the template can be
          # validated on Linux without the real (never in repo) founder secret.
          sed -i 's|C:/ProgramData/Aether/caddy/founder-auth.caddy|founder-auth.caddy|' caddy-validate/Caddyfile
          # Generate a real, valid cost-14 bcrypt hash inside the Caddy image for a
          # throwaway test password, then write the fragment and validate.
          # Password "ci-only-guard" is never used in production.
          CI_HASH="$(docker run --rm caddy:2.11.3 caddy hash-password --algorithm bcrypt --bcrypt-cost 14 --plaintext 'ci-only-guard')"
          printf 'basic_auth bcrypt "Aether Founder Alpha" {\n    founder %s\n}\n' "$CI_HASH" > caddy-validate/founder-auth.caddy
          docker run --rm -v "${{ github.workspace }}/caddy-validate:/config" \
            caddy:2.11.3 caddy validate --config /config/Caddyfile --adapter caddyfile
      - name: Upload Gateway test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-receipt
          path: gateway-test-receipt.json
          if-no-files-found: ignore
