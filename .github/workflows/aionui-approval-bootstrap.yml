name: AionUi Approval Inbox Bootstrap

on:
  push:
    branches:
      - agent/aionui-approval-inbox
    paths:
      - .github/aionui-approval-bootstrap/**
      - .github/workflows/aionui-approval-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: aionui-approval-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/aionui-approval-inbox
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/aionui-approval-bootstrap/patch.part.* > /tmp/aionui-approval.patch.gz.b64
          base64 --decode /tmp/aionui-approval.patch.gz.b64 > /tmp/aionui-approval.patch.gz
          gzip --decompress --stdout /tmp/aionui-approval.patch.gz > /tmp/aionui-approval.patch
          echo "416501b63a438b31d3aabf492aaf8815e542e43f7e2076f7316087116195b434  /tmp/aionui-approval.patch" | sha256sum --check --strict
          git apply --check /tmp/aionui-approval.patch

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/aionui-approval.patch
          rm -rf .github/aionui-approval-bootstrap
          rm -f .github/workflows/aionui-approval-bootstrap.yml

      - name: Commit coherent implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aether-ci"
          git config user.email "aether-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build generic AionUi Approval Inbox"
          git push origin HEAD:agent/aionui-approval-inbox
