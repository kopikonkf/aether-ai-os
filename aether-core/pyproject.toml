[project]
name = "aether-core"
version = "2.0.0"
description = "Aether Cognitive Orchestrator - Primitive Architecture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
telegram = ["telethon>=1.30.0"]
hub = ["aiosqlite>=0.19.0", "bcrypt>=4.0.0", "python-multipart>=0.0.6"]
voice = ["google-cloud-texttospeech>=2.16.0"]
dev = ["pytest>=7.0", "ruff>=0.1.0"]
all = ["aether-core[telegram,hub,voice,dev]"]

[project.scripts]
aether-hub = "hermes.hub.server:main"
aether-boot = "hermes.executive.boot:main"
aether-check = "hermes.consciousness.integration_audit:main"
aether-daemon = "hermes.adapters.daemon:main"
aether-body = "aether.runtime.body:main"
aether-founder-acceptance = "aether.runtime.founder_acceptance_cli:main"
aether-mcp = "aether.runtime.mcp:main"
aether-mvp20 = "aether.runtime.mvp20:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.egg-info"]
