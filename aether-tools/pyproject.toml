[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-tools"
version = "0.3.0"
description = "Aether's tool primitives — OS-agnostic read, write, edit, grep, glob, bash, webfetch"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]
