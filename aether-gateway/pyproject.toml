[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-gateway"
version = "0.19.2"
description = "Aether Gateway — API, Telegram Bot, MCP Server"
requires-python = ">=3.11"
dependencies = [
    "aether-core>=0.19.2",
    "aether-tools>=0.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-telegram-bot>=21.0",
    "mcp>=1.27,<2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "gtts>=2.0.0",
    "requests>=2.31.0",
    "websockets>=11.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
]
livekit = [
    "livekit-agents>=1.3.1,<2.0",
    "livekit-api>=1.0,<2.0",
    "livekit-plugins-silero>=1.0,<2.0",
    "livekit-plugins-turn-detector>=1.0,<2.0",
]

[project.scripts]
aether-gateway = "aether_gateway.api.server:start_server"
aether-sense-worker = "aether_gateway.browser_senses.worker:main"
aether-mcp = "aether_gateway.mcp.server:main"
aether-living-mcp = "aether_gateway.mcp.living_server_entry_v3:main"
aether-oauth-edge = "aether_gateway.oauth_edge.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aether_gateway.providers" = ["*.yaml"]
"aether_gateway.aionui_runtime_console" = ["*.html", "*.css", "*.js", "*.json"]
"aether_gateway.aionui_mission_console" = ["*.html", "*.css", "*.js", "*.json"]
"aether_gateway.aionui_opportunity_console" = ["*.html", "*.css", "*.js", "*.json"]
"aether_gateway.aionui_experiment_console" = ["*.html", "*.css", "*.js", "*.json"]
"aether_gateway.aionui_senses_console" = [
    "*.html", "*.css", "*.js", "*.json", "*.webmanifest",
    "vendor/*.js", "icons/*.png",
]
